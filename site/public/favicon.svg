  <!--
    Monogramme Crosswell, dupliqué depuis src/components/brand/Monogramme.tsx.
    Un favicon est servi en fichier statique : il ne peut pas importer le
    composant. Si le tracé change là-bas, il faut le reporter ici.

    Le tracé mesure 56x54 et porte sa propre forme de fond (squircle plein,
    fleur évidée) : aucun carré derrière lui, il se pose aussi bien sur un
    onglet clair que sombre. Le viewBox décale d'un pixel vers le haut pour
    centrer ces 54 de hauteur dans une boîte carrée, plutôt que d'étirer le
    dessin — un monogramme ovalisé se remarque, même à 16 px.
  -->
